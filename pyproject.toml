[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adk-sdp-capable-agent-template"
version = "0.1.0"
description = "Reference Google ADK agent template decoupling Model Armor binary prompt blocking from Cloud SDP post-inference in-place PII redaction for Gemini Enterprise."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "google-cloud-dlp>=3.25.0",
    "google-cloud-modelarmor>=0.1.0",
    "google-genai>=1.10.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "google-cloud-agentplatform>=1.70.0",
    "requests>=2.32.0",
]

[tool.setuptools.packages.find]
include = ["app*", "config*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_gcp: integration tests that invoke live GCP Cloud SDP / Vertex AI endpoints",
]
